<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khyber Darbar - Your Shahi Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #800020;    /* Burgundy */
            --secondary-color: #D4AF37;  /* Gold */
            --card-bg: rgba(20, 20, 20, 0.95);
            --font-display: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--font-sans); 
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('images/hero1.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; line-height: 1.6; 
        }

        .container { width: 90%; max-width: 1200px; margin: 0 auto; padding-bottom: 4rem; }

        /* HERO TITLE SECTION */
        .menu-hero-text { text-align: center; padding: 60px 0 40px 0; }
        .menu-hero-text h1 { 
            font-family: var(--font-display); 
            color: white; 
            font-size: 3.8rem; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-weight: 700;
        }
        .menu-hero-text p {
            font-size: 1.1rem;
            color: #ccc;
            margin-top: 10px;
            font-weight: 300;
        }

        /* CART LAYOUT SPLIT */
        .cart-wrapper { display: grid; grid-template-columns: 1.6fr 1fr; gap: 30px; margin-top: 2rem; }
        @media (max-width: 992px) { .cart-wrapper { grid-template-columns: 1fr; } }

        /* TABLE STYLING */
        .cart-table-container { background: var(--card-bg); border: 1px solid rgba(212,175,55,0.15); border-radius: 12px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { font-family: var(--font-display); color: var(--secondary-color); font-size: 1.3rem; padding: 1rem; border-bottom: 1px solid rgba(212,175,55,0.3); letter-spacing: 1px; }
        td { padding: 1.2rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }

        .qty-control { display: flex; align-items: center; gap: 12px; }
        .qty-control button { background: none; border: 1px solid var(--secondary-color); color: var(--secondary-color); width: 28px; height: 28px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .qty-control button:hover { background: var(--secondary-color); color: #000; }
        
        .remove-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1rem; transition: var(--transition-smooth); }
        .remove-btn:hover { color: #ff1a1a; transform: scale(1.1); }

        /* CHECKOUT FORM & PROMO */
        .checkout-box { background: var(--card-bg); border: 1px solid var(--secondary-color); border-radius: 12px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); height: fit-content; }
        .checkout-box h2 { font-family: var(--font-display); color: var(--secondary-color); font-size: 1.8rem; margin-bottom: 1.5rem; text-transform: uppercase; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 0.5rem;}
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 0.4rem; color: #ccc; letter-spacing: 0.5px; font-weight: 600; }
        .form-control { width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(212,175,55,0.3); color: #fff; border-radius: 4px; font-family: var(--font-sans); transition: var(--transition-smooth); }
        .form-control:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }

        /* Promo Code Layout */
        .promo-input-group { display: flex; gap: 10px; }
        .promo-btn { 
            background: transparent; 
            color: var(--secondary-color); 
            border: 1px solid var(--secondary-color); 
            padding: 0 1.5rem; 
            font-size: 0.9rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: var(--transition-smooth); 
        }
        .promo-btn:hover { background: var(--secondary-color); color: #000; }
        .promo-status { font-size: 0.85rem; margin-top: 0.3rem; display: block; }

        .payment-method { background: rgba(128,0,32,0.2); border: 1px dashed var(--primary-color); padding: 1rem; border-radius: 4px; margin-top: 1rem; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;}
        
        .total-row { display: flex; flex-direction: column; gap: 5px; margin: 1.5rem 0; padding-top: 1rem; border-top: 1px dashed rgba(212,175,55,0.4); }
        .summary-item { display: flex; justify-content: space-between; font-size: 0.95rem; color: #ccc; }
        .grand-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; font-weight: bold; }
        .total-label { font-size: 1.1rem; color: #fff; }
        .total-price { color: var(--secondary-color); font-size: 1.6rem; }

        .order-btn { width: 100%; background: var(--primary-color); color: #fff; border: 1px solid var(--secondary-color); padding: 1rem; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; cursor: pointer; transition: var(--transition-smooth); }
        .order-btn:hover { background: var(--secondary-color); color: #000; }

        /* Empty Cart State Style */
        .empty-cart-message {
            text-align: center;
            padding: 3rem 1rem;
            font-family: var(--font-display);
            color: #aaa;
        }
        .empty-cart-message h3 {
            font-size: 2rem;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }
        /* Style for the link inside empty state */
        .empty-cart-message a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed var(--secondary-color);
            transition: var(--transition-smooth);
        }
        .empty-cart-message a:hover {
            color: #fff;
            border-bottom-color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu-hero-text">
            <h1>Your Shahi Cart</h1>
            <p>Review your selection and proceed to absolute premium culinary fulfillment</p>
        </div>

        <div class="cart-wrapper">
            <div class="cart-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Dish</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- Loaded dynamically via JS -->
                    </tbody>
                </table>
            </div>

            <div class="checkout-box">
                <h2>Shahi Checkout</h2>
                <form id="checkoutForm" onsubmit="placeOrder(event)">
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="custName" class="form-control" required placeholder="Enter Full Name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="custPhone" class="form-control" required placeholder="e.g., 03XXXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" id="custEmail" class="form-control" required placeholder="name@domain.com">
                    </div>
                    <div class="form-group">
                        <label>Delivery Address *</label>
                        <textarea id="custAddress" class="form-control" rows="3" required placeholder="Complete home or office address details"></textarea>
                    </div>

                    <!-- PROMO CODE FIELD -->
                    <div class="form-group">
                        <label>Promo Code</label>
                        <div class="promo-input-group">
                            <input type="text" id="promoCode" class="form-control" placeholder="e.g. SHAHI10" style="text-transform: uppercase;">
                            <button type="button" class="promo-btn" onclick="applyPromo()">Apply</button>
                        </div>
                        <span id="promoStatus" class="promo-status"></span>
                    </div>

                    <div class="payment-method">
                        <i class="fas fa-truck" style="color: var(--secondary-color);"></i>
                        <span><strong>Payment Mode:</strong> Cash on Delivery (COD)</span>
                    </div>

                    <div class="total-row">
                        <div class="summary-item">
                            <span>Cart Subtotal:</span>
                            <span id="cartSubtotal">Rs. 0</span>
                        </div>
                        <div class="summary-item" id="discountRow" style="display: none; color: #2ecc71;">
                            <span>Discount:</span>
                            <span id="cartDiscount">-Rs. 0</span>
                        </div>
                        <div class="grand-total-row">
                            <span class="total-label">Grand Total:</span>
                            <span class="total-price" id="cartGrandTotal">Rs. 0</span>
                        </div>
                    </div>

                    <button type="submit" class="order-btn">Order Now</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Safely retrieve current storage state (Fallback dynamically to empty array)
        function getCart() {
            let cart = localStorage.getItem("KHYBER_DARBAR_CART") || localStorage.getItem("khyberCart") || localStorage.getItem("cart");
            try {
                return cart ? JSON.parse(cart) : []; 
            } catch (e) {
                return [];
            }
        }

        let currentDiscount = 0;

        function renderCartTable() {
            const tableBody = document.getElementById('cartTableBody');
            const cart = getCart();

            if (!cart || cart.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-cart-message">
                                <h3>Your Cart is Empty</h3>
                                <p><a href="menu.html">Explore our menu</a> to add exquisite Shahi delicacies.</p>
                            </div>
                        </td>
                    </tr>
                `;
                updateTotals(0);
                return;
            }

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                // Safe Check: Handles both "quantity" and "qty" variable keys to avoid NaN
                const itemQty = parseInt(item.quantity || item.qty || 0);
                const itemPrice = parseInt(item.price || 0);
                const itemSubtotal = itemPrice * itemQty;
                subtotal += itemSubtotal;

                html += `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>Rs. ${itemPrice}</td>
                        <td>
                            <div class="qty-control">
                                <button type="button" onclick="changeQty(${index}, -1)">-</button>
                                <span>${itemQty}</span>
                                <button type="button" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td>Rs. ${itemSubtotal}</td>
                        <td>
                            <button type="button" class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
            updateTotals(subtotal);
        }

        function changeQty(index, amount) {
            let cart = getCart();
            // Handle both object keys dynamically
            let currentQty = parseInt(cart[index].quantity || cart[index].qty || 0);
            let newQty = currentQty + amount;

            if (newQty <= 0) {
                cart.splice(index, 1);
            } else {
                if (cart[index].quantity !== undefined) cart[index].quantity = newQty;
                if (cart[index].qty !== undefined) cart[index].qty = newQty;
            }
            saveCart(cart);
            renderCartTable();
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCartTable();
        }

        function saveCart(cart) {
            localStorage.setItem("KHYBER_DARBAR_CART", JSON.stringify(cart));
            localStorage.setItem("khyberCart", JSON.stringify(cart));
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        function updateTotals(subtotal) {
            document.getElementById('cartSubtotal').innerText = `Rs. ${subtotal}`;
            
            let discountAmount = 0;
            if (subtotal > 0 && currentDiscount > 0) {
                discountAmount = Math.round(subtotal * (currentDiscount / 100));
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('cartDiscount').innerText = `-Rs. ${discountAmount}`;
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }

            const grandTotal = Math.max(0, subtotal - discountAmount);
            document.getElementById('cartGrandTotal').innerText = `Rs. ${grandTotal}`;
        }

        function applyPromo() {
            const cart = getCart();
            const statusLabel = document.getElementById('promoStatus');
            const promoInput = document.getElementById('promoCode').value.trim().toUpperCase();

            if (cart.length === 0) {
                statusLabel.style.color = "#ff4d4d";
                statusLabel.innerText = "Cannot apply promo code to an empty cart.";
                return;
            }

            if (promoInput === "SHAHI10") {
                currentDiscount = 10; 
                statusLabel.style.color = "#2ecc71";
                statusLabel.innerText = "✓ 'SHAHI10' applied successfully! 10% discount active.";
                localStorage.setItem("shahi_promo", "SHAHI10");
            } else if (promoInput === "") {
                statusLabel.style.color = "#ff4d4d";
                statusLabel.innerText = "Please enter a valid code.";
            } else {
                statusLabel.style.color = "#ff4d4d";
                statusLabel.innerText = "Invalid Promo Code.";
                currentDiscount = 0;
            }
            renderCartTable();
        }

        function placeOrder(event) {
            event.preventDefault(); 
            
            let cart = getCart();
            if(!cart || cart.length === 0) {
                alert("❌ Your cart is empty. Please add items to your cart before checking out.");
                return;
            }

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const email = document.getElementById('custEmail').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if(!name || !phone || !email || !address) {
                alert("⚠️ Please fill in all the required (*) fields.");
                return;
            }

            alert(`🎉 Thank you, ${name}!\nYour Shahi order has been placed successfully.\nWe will contact you shortly at ${phone}.`);
            
            localStorage.removeItem("KHYBER_DARBAR_CART");
            localStorage.removeItem("khyberCart");
            localStorage.removeItem("cart");
            localStorage.removeItem("shahi_promo"); 

            window.location.href = 'index.html';
        }

        window.onload = function() {
            const savedPromo = localStorage.getItem("shahi_promo");
            if (savedPromo === "SHAHI10") {
                document.getElementById('promoCode').value = savedPromo;
                currentDiscount = 10;
                document.getElementById('promoStatus').style.color = "#2ecc71";
                document.getElementById('promoStatus').innerText = "✓ 'SHAHI10' applied successfully! 10% discount active.";
            }
            renderCartTable();
        };
    </script>
</body>
</html>
